name: build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.8"
      - name: Compilar
        run: |
          unzip -o mod.zip -d proyecto
          cd "$(dirname "$(find proyecto -name settings.gradle | head -1)")"
          gradle build --no-daemon
          mkdir -p "$GITHUB_WORKSPACE/salida"
          cp build/libs/*.jar "$GITHUB_WORKSPACE/salida/"
      - uses: actions/upload-artifact@v4
        with:
          name: mod-jar
          path: salida/*.jar
